name: FindTheRainbow
options:
  bundleIdPrefix: com.bbhanda1
  deploymentTarget:
    iOS: "17.0"
targets:
  FindTheRainbow:
    type: application
    platform: iOS
    sources:
      - Sources/FindTheRainbow
      - path: Resources
        buildPhase: resources
    info:
      path: Sources/FindTheRainbow/Info.plist
      properties:
        CFBundleDisplayName: "Pop Off!"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bbhanda1.FindTheRainbow
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSRequiresIPhoneOS: true
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: Y65K339Z7J
        CODE_SIGN_STYLE: Automatic
